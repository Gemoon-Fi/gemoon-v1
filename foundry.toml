[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
ast = true
build_info = true
extra_output = ["storageLayout"]
optimizer = true
# Gas of the local test EVM (default 2^30). GemoonLensGasTest deploys 340 Memes in setUp and sat
# at the edge of the default. Gas limits that matter are asserted by the tests themselves.
gas_limit = 4_000_000_000
# DeployGemoon reads the reward asset list and writes its report into deploy-logs/ (gitignored).
fs_permissions = [
  { access = "read", path = "./tools/scripts" },
  { access = "read-write", path = "./deploy-logs" }
]



# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

remappings = [
  'lib/uniswap-hooks/:@openzeppelin/contracts/=lib/uniswap-hooks/lib/openzeppelin-contracts/contracts/',
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
  '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
  '@uniswap-v4-core/=lib/v4-periphery/lib/v4-core/src/',
  '@uniswap-v4-periphery/=lib/v4-periphery/src/',
  'permit2/=lib/v4-periphery/lib/permit2/',
  'uniswap-hooks/=lib/uniswap-hooks/src/',
  '@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/',
  '@uniswap/v4-periphery/=lib/v4-periphery/',
  '@uniswap/v3-core/=lib/v3-core/'
]